name: Günlük Brifing

on:
  schedule:
    # 05:07 UTC = 08:07 Türkiye saati (Türkiye UTC+3, yaz/kış saati yok).
    # Saati değiştirmek için ilk sayıyı (dakika) ve ikinci sayıyı (UTC saat) düzenle.
    # Tam saat başına koymamak iyi olur; GitHub o dakikalarda yoğun olur.
    - cron: "7 5 * * *"
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write # sent.json'u repoya geri yazmak için

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Brifingi hazırla ve gönder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python briefing.py

      - name: Gönderilenler listesini kaydet
        run: |
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git config user.name "briefing-bot"
            git config user.email "briefing-bot@users.noreply.github.com"
            git add sent.json
            git commit -m "chore: sent.json güncellendi"
            git push
          fi
